name: generate contribution snake
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: anhtudotinfo
          outputs: |
            dist/github-snake.svg?color_snake=#38bdf8&color_dots=#0b1220,#0c4a6e,#0369a1,#0284c7,#38bdf8
            dist/github-snake-light.svg?color_snake=#0284c7&color_dots=#e2e8f0,#bae6fd,#7dd3fc,#38bdf8,#0284c7
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
